name: Fusion V5 autonomous audit and bounded repair
# 2026-11-07 recovery audit retest: hero-size font, smaller inner-arc title, clean confidence/progress ROIs.
# 2026-11-07 recovery owner-poster phase: 3-colour wide arc, bounded score, true confidence, six-value segments; audit strictly before next screen.
# 2026-11-07 locked Overview geometry retest after measured 2/11 poster deviations, tracking and ratio recenter.
# 2026-11-07 retest original-design region acceptance after fixing escaped Python newline in legacy regression guard.
# 2026-11-07 retry corrected legacy 6-dot test guard after poster 3-group active navigation source audit.
# 2026-11-07 V6 poster-geometry cycle: native 454px crop, 11 strict Overview regions, font-size hierarchy and 3-dot layout.
# 2026-11-06 V6 Overview third evidence-gated iteration: full-height status and true mockup cyan typography.
# 2026-11-06 second Overview layout cycle: vertical spacing, glyph sizes and pinned master mask audit, no beta release.
# 2026-11-06 Overview exact-poster iteration: green status, bounded values, seven-day graph, rationale and true bezel registration.
# 2026-11-06 mandatory owner-approved design comparison stage; fail closed.

# Runs independently of ChatGPT. Public logs contain no private code or physiology.
# This never signs/publishes a Garmin beta and never modifies production branch.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fusion-autonomous-v5.yml']
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fusion-v5-autonomous-controller
  cancel-in-progress: false

jobs:
  audit-and-repair:
    if: >-
      github.repository == 'hectorPascualC/fusion-training-status-ci' &&
      (github.event_name == 'schedule' || github.actor == 'hectorPascualC')
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Check out public runner scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm read-only private source access
        shell: bash
        env:
          FUSION_READ_TOKEN: ${{ secrets.FUSION_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$FUSION_READ_TOKEN" || {
            echo 'BLOCKED: FUSION_PRIVATE_READ_TOKEN is missing'
            exit 1
          }
      - name: Fetch V5 private feature branch without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hectorPascualC/fusion-training-status
          ref: ui/v5-device-alignment-20261106
          path: private
          token: ${{ secrets.FUSION_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: PHASE 1 — verify six independently approved design references
        shell: bash
        run: |
          set -euo pipefail
          python3 private/scripts/fusion_design_fidelity_gate.py
          echo "PHASE 1 approved sketch baseline: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: PHASE 2 — shared font size, alignment and circular safe-area audit
        shell: bash
        run: |
          set -euo pipefail
          cd private
          python3 scripts/validate_poster_layout_v6.py
          echo "PHASE 2 shared typography and safe layout: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Detect and repair known visual regressions, then audit source
        shell: bash
        run: |
          set -euo pipefail
          python3 private/scripts/fusion_auto_repair.py --apply --report /tmp/fusion-auto-repair.json
          cd private
          python3 scripts/fusion_auto_repair.py
          python3 scripts/validate_performance_audit.py
          bash scripts/validate_repo.sh
          python3 scripts/scan_repo_secrets.py
          git diff --check
      - name: Persist only verified allowlisted feature-branch fixes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FUSION_PRIVATE_AUTOFIX_TOKEN || secrets.FUSION_PRIVATE_RELEASE_TOKEN }}
        run: python3 scripts/fusion_commit_layout.py private
      - name: Repeat Garmin, Android and real six-page simulator checks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fusion_repair_cycle.py
